<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>更好的编辑器</title>
    <script type="module" src="/src/main.ts"></script>
    <link rel="stylesheet" href="/src/style.css">
  </head>
  <body>
    <div id="editor">
      <div id="save-content"></div>
      页面标题：
      <input id="title" class="text" type="text" size="35" maxlength="128">
      <textarea id="source" class="text" rows="20" cols="60" placeholder="在此输入页面代码……"></textarea>
      页面标签：
      <input id="tags" class="text" type="text" size="35" maxlength="128">
      <div id="buttons">
        <input id="preview-button" class="btn" type="button" value="预览">
        <input id="save-button" class="btn" type="button" value="保存">
      </div>
    </div>
    <iframe id="preview"></iframe>
  </body>
</html>
